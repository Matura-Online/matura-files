name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22.5'

      - name: Install ffmpeg and ExifTool
        run: sudo apt-get update && sudo apt-get install -y ffmpeg exiftool

      - name: Restore the last generated study data
        run: |
          mkdir -p source
          catalog_tmp="$(mktemp)"
          filters_tmp="$(mktemp)"
          if curl --fail --silent --show-error --location --max-time 30 --output "$catalog_tmp" https://files.matura.top/programi.json \
            && curl --fail --silent --show-error --location --max-time 30 --output "$filters_tmp" https://files.matura.top/filters.json; then
            mv "$catalog_tmp" source/programi.json
            mv "$filters_tmp" source/filters.json
          else
            rm -f "$catalog_tmp" "$filters_tmp"
            echo "No previous generated study artifacts are available; run Refresh study programs first."
          fi

      - name: Build the published source tree
        run: go run .

      - name: Copy static HTML files
        run: cp -r ./html/* ./source/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./source

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5


name: Refresh study programs

on:
  schedule:
    - cron: '0 3 1 1,3,6,10 *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.5'

      - name: Install ffmpeg and ExifTool
        run: sudo apt-get update && sudo apt-get install -y ffmpeg exiftool

      - name: Download and parse study requirements
        run: go run . --refresh-programs

      - name: Build the complete published source tree
        run: go run .

      - name: Copy static HTML files
        run: cp -r ./html/* ./source/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./source

      - name: Deploy refreshed site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

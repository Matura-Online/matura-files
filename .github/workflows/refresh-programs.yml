name: Refresh study programs

on:
  schedule:
    - cron: '0 3 1 1,3,6,10 *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22.5'

      - name: Install ffmpeg and ExifTool
        run: sudo apt-get update && sudo apt-get install -y ffmpeg exiftool

      # The published catalog is also the verified relation snapshot. A refresh
      # may update HTML details, but it must not manufacture area/field membership
      # for a new program id that has not been fully recaptured.
      - name: Restore verified search relations
        run: |
          mkdir -p source
          curl --fail --silent --show-error --location --max-time 30 \
            --output source/programi.json https://files.matura.top/programi.json
          go run . --validate-study source/programi.json

      - name: Download and parse study requirements
        run: go run . --refresh-programs --study-html-archive "$RUNNER_TEMP/programi-html.zip"

      - name: Upload programi.json snapshot
        uses: actions/upload-artifact@v7
        with:
          name: programi.json
          path: source/programi.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload dependent study-filter snapshot
        uses: actions/upload-artifact@v7
        with:
          name: filters.json
          path: source/filters.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload raw study HTML archive
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: programi-html
          path: ${{ runner.temp }}/programi-html.zip
          if-no-files-found: warn
          retention-days: 90

      - name: Build the complete published source tree
        run: go run .

      - name: Copy static HTML files
        run: cp -r ./html/* ./source/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./source

      - name: Deploy refreshed site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

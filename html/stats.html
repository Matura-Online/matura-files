<!DOCTYPE html>
<html lang='en'>
    <head>
        <meta charset='UTF-8' />
        <meta name='viewport' content='width=device-width, initial-scale=1.0' />
        <meta name='description' content='Matura Online - File statistics showing total size, per-type and per-subject breakdown.' />
        <link rel='icon' href='https://matura.top/favicon.ico' type='image/x-icon' />
        <meta name='author' content='Matura Online' />
        <meta name='theme-color' content='#b99c6a' />
        <link rel='stylesheet' href='style.css' />
        <title>Stats - Matura Online</title>
    </head>

    <body>
        <div class='container'>
            <div class='nav'>
                <a href='/'>Home</a>
                <span class='sep'>|</span>
                <a href='/files.html'>Files</a>
                <span class='sep'>|</span>
                <a href='/stats.html'>Stats</a>
            </div>

            <div class='grid' id='byType'></div>
        </div>

        <script>
            (async () => {
                const res = await fetch('/stats.json');
                const stats = await res.json();

                function fmt(n) {
                    if (n >= 1e9) return (n/1e9).toFixed(2) + ' GB';
                    if (n >= 1e6) return (n/1e6).toFixed(2) + ' MB';
                    if (n >= 1e3) return (n/1e3).toFixed(2) + ' KB';
                    return n + ' B';
                }

                function bar(v, max) {
                    const pct = max > 0 ? (v / max) * 100 : 0;
                    return `<div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>`;
                }

                const maxType = Math.max(...Object.values(stats.byType).map(t => t.totalBytes));
                const typeEl = document.getElementById('byType');
                for (const [ext, t] of Object.entries(stats.byType).sort((a,b) => b[1].totalBytes - a[1].totalBytes)) {
                    typeEl.innerHTML += `
                        <div class="stat-box">
                            <h3>.${ext}</h3>
                            <div class="row"><span>${t.count} files</span><span>${fmt(t.totalBytes)}</span></div>
                            ${bar(t.totalBytes, maxType)}
                        </div>`;
                }
            })();
        </script>
    </body>
</html>

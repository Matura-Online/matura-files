<!DOCTYPE html>
<html lang='en'>
    <head>
        <meta charset='UTF-8' />
        <meta name='viewport' content='width=device-width, initial-scale=1.0' />
        <meta name='description' content='Matura Online - File tree explorer showing all hosted resources by year, subject and type.' />
        <link rel='icon' href='https://matura.top/favicon.ico' type='image/x-icon' />
        <meta name='author' content='Matura Online' />
        <meta name='theme-color' content='#b99c6a' />
        <link rel='stylesheet' href='style.css' />
        <title>Files - Matura Online</title>
    </head>

    <body>
        <div class='container'>
            <div class='nav'>
                <a href='/'>Home</a>
                <span class='sep'>|</span>
                <a href='/files.html'>Files</a>
                <span class='sep'>|</span>
                <a href='/stats.html'>Stats</a>
            </div>

            <input type='search' id='filter' class='filter' placeholder='Filter... (e.g. "2024 ljeto eng")' />

            <div class='card'>
                <div id='tree'>Loading..</div>
            </div>
        </div>

        <script>
            let treeData;
            const el = document.getElementById('tree');
            const filter = document.getElementById('filter');
            const base = window.location.origin;

            function fmt(n) {
                if (n >= 1e9) return (n/1e9).toFixed(2) + ' GB';
                if (n >= 1e6) return (n/1e6).toFixed(2) + ' MB';
                if (n >= 1e3) return (n/1e3).toFixed(2) + ' KB';
                return n + ' B';
            }

            function dirSize(nodes, prefix) {
                let s = 0;
                for (const n of nodes) {
                    n._path = prefix ? prefix + '/' + n.name : n.name;
                    if (n.isDir && n.children) {
                        n.size = dirSize(n.children, n._path);
                        s += n.size;
                    } else {
                        s += n.size || 0;
                    }
                }
                return s;
            }

            function nodeEl(n, depth) {
                depth = depth || 0;
                const div = document.createElement('div');
                div.className = 't-line';
                div.style.paddingLeft = (depth * 1.5) + 'rem';

                const inner = document.createElement('span');
                inner.className = n.isDir ? 't-dir' : 't-file';
                inner.textContent = n.isDir ? n.name + '/' : n.name;
                div.appendChild(inner);

                if (n.size) {
                    const sz = document.createElement('span');
                    sz.className = 't-sz';
                    sz.textContent = fmt(n.size);
                    div.appendChild(sz);
                }

                if (n.isDir && n.children && n.children.length) {
                    inner.style.cursor = 'pointer';
                    const kids = document.createElement('div');
                    kids.className = 't-kids';
                    for (const c of n.children) kids.appendChild(nodeEl(c, depth + 1));
                    div.appendChild(kids);
                    inner.addEventListener('click', function() { kids.classList.toggle('t-hidden'); });
                } else if (!n.isDir) {
                    inner.style.cursor = 'pointer';
                    inner.addEventListener('click', function() { window.open(base + '/' + n._path, '_blank'); });
                }

                return div;
            }

            function matches(n, qt) {
                const low = n.name.toLowerCase();
                if (qt.every(function(t) { return low.includes(t); })) return true;
                if (n.children && n.children.length) {
                    for (const c of n.children) {
                        if (matches(c, qt)) return true;
                    }
                }
                return false;
            }

            function filterTree(nodes, qt) {
                if (!qt) return nodes;
                return nodes.filter(function(n) { return matches(n, qt); });
            }

            function render() {
                el.innerHTML = '';
                dirSize(treeData, '');
                const q = filter.value.trim();
                const filtered = filterTree(treeData, q ? q.toLowerCase().split(/\s+/) : null);
                for (const n of filtered) {
                    const nEl = nodeEl(n, 0);
                    if (n.isDir && n.children && n.children.length) {
                        const kids = nEl.querySelector(':scope > .t-kids');
                        if (kids) kids.classList.remove('t-hidden');
                    }
                    el.appendChild(nEl);
                }
            }

            (async function() {
                treeData = await fetch('/files.json').then(function(r) { return r.json(); });
                render();
                filter.addEventListener('input', render);
            })();
        </script>
    </body>
</html>
